name: Release

# Pushing a version tag (e.g. v0.1) builds the app and publishes it as a
# GitHub release. The tag must match <Version> in Directory.Build.props, and
# CHANGELOG.md must have a "## <version>" section, shown on the release page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match Directory.Build.props version $version"
            exit 1
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))(\s|$)" -Quiet)) {
            Write-Error "CHANGELOG.md has no section for $version"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test
        run: dotnet test tests/SourisFacile.Tests -c Release

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, then the install notes.
          $section = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') {
              $inSection = $line -match "^## $([regex]::Escape($env:VERSION))(\s|$)"
              continue
            }
            if ($inSection) { $section += $line }
          }
          $whatsNew = ($section -join "`n").Trim()
          if (-not $whatsNew) {
            Write-Error "CHANGELOG.md has no section for $env:VERSION"
            exit 1
          }
          $notes = @"
          ## What's new

          $whatsNew

          ## Install

          - **SourisFacileFenetre-$env:VERSION-setup.exe**: the installer. It asks whether to install for you only (no administrator rights needed) or for all users (asks for them), and picks the x64 or Arm build.
          - **SourisFacileFenetre-$env:VERSION-x64-portable.exe** / **-arm64-portable.exe**: run it from anywhere, nothing to install.

          Windows 10 or 11. The executables aren't signed, so SmartScreen may warn the first time: click **More info**, then **Run anyway**.
          "@
          gh release create $env:GITHUB_REF_NAME `
            "build/SourisFacileFenetre-$env:VERSION-setup.exe" `
            "build/SourisFacileFenetre-$env:VERSION-x64-portable.exe" `
            "build/SourisFacileFenetre-$env:VERSION-arm64-portable.exe" `
            --title "Souris facile fenêtre $env:VERSION" `
            --notes $notes
